<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="aichat.window_title">Lare — AI Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: rgba(15, 15, 22, var(--window-alpha, 0.87));
      --text: rgba(220, 235, 255, 0.92);
      --border: rgba(80, 160, 240, 0.50);
      --muted: rgba(130, 190, 255, 0.55);
    }
    html { background: transparent; width: 100%; height: 100%; }
    body {
      width: 100%; height: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      /* Standard font unico app-wide (0.45.2): Cascadia Mono, monospace piu'
         sottile di Consolas, fallback a Consolas se non installato. */
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      display: flex; flex-direction: column;
    }
    #titlebar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 12px 6px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); flex-shrink: 0; user-select: none;
    }
    #close-btn { background: transparent; border: none; color: var(--muted);
      font-size: 15px; cursor: pointer; padding: 0 4px; }
    #close-btn:hover { color: rgba(220, 100, 80, 0.90); }
    #roster { padding: 4px 16px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid rgba(80,160,240,0.18); flex-shrink: 0; }
    #consent { display: none; padding: 8px 16px; gap: 8px;
      background: rgba(80,160,240,0.12); border-bottom: 1px solid var(--border);
      align-items: center; flex-shrink: 0; }
    #consent.show { display: flex; }
    #consent-text { flex: 1; }
    #consent button { cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text); border-radius: 6px; padding: 2px 10px; }
    /* Banner del modello di AMMISSIONE (Task 10): gate 1 (nuovo arrivato), gate 2
       (presente che vota), attesa (pending) e rifiuto+re-request. Stessa "grammatica
       visiva" del vecchio #consent qui sopra (riusata via classe condivisa) — nascosti
       di default, mostrati aggiungendo/togliendo la classe `.show` da JS. */
    .gate-banner { display: none; padding: 8px 16px; gap: 8px;
      background: rgba(80,160,240,0.12); border-bottom: 1px solid var(--border);
      align-items: center; flex-shrink: 0; }
    .gate-banner.show { display: flex; }
    .gate-banner span { flex: 1; }
    .gate-banner button { cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text); border-radius: 6px; padding: 2px 10px; }
    .gate-banner button:disabled { opacity: 0.5; cursor: default; }
    #transcript { flex: 1; overflow-y: auto; padding: 8px 16px;
      display: flex; flex-direction: column; gap: 4px; }
    .line { line-height: 1.35; word-break: break-word; }
    .line .lbl { color: var(--muted); margin-right: 6px; }
    .line.self .lbl { color: rgba(120, 230, 160, 0.85); }
    /* Badge is_ai (Task 9): distingue un mittente AI da uno umano SOLO visivamente
       (icona via ::before + colore etichetta) — mai concatenato al testo del nome
       in JS, perché un nickname scelto dall'AI è un nome proprio a tutti gli
       effetti (vedi doc-comment su messageLine in aichat-view.mjs). */
    .line.ai .lbl { color: rgba(200, 170, 255, 0.85); }
    .line.ai .lbl::before { content: "🤖 "; }
    /* Riga di sistema (es. "peer sparito", Task 12): distinta da un messaggio di chat
       normale — corsivo + colore muted già usato per etichette/roster (coerenza con
       il resto del foglio di stile, nessun nuovo valore introdotto). */
    .line.system { font-style: italic; color: var(--muted); }
    #input-row { display: flex; gap: 6px; padding: 8px 12px;
      border-top: 1px solid var(--border); flex-shrink: 0; }
    #msg { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); padding: 6px 10px; font: inherit; outline: none; }
  </style>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region>
    <span id="titlebar-text">AICHAT</span>
    <button id="close-btn" data-i18n-title="common.close" data-i18n-aria-label="common.close" title="Chiudi" aria-label="Chiudi">&#x00D7;</button>
  </div>
  <div id="roster" data-i18n="aichat.roster_empty">presenti: —</div>
  <div id="consent">
    <span id="consent-text"></span>
    <button id="consent-yes" data-i18n="aichat.btn_enter">Entra</button>
    <button id="consent-no" data-i18n="common.no">No</button>
  </div>
  <!-- Gate 1 (nuovo arrivato): "vuoi entrare in chat con A e C?" -->
  <div id="gate1" class="gate-banner">
    <span id="gate1-text"></span>
    <button id="gate1-yes" data-i18n="aichat.btn_enter">Entra</button>
    <button id="gate1-no" data-i18n="common.cancel">Annulla</button>
  </div>
  <!-- Gate 2 (presente): "B chiede di entrare. Ammetti?" -->
  <div id="gate2" class="gate-banner">
    <span id="gate2-text"></span>
    <button id="gate2-yes" data-i18n="aichat.btn_admit">Ammetti</button>
    <button id="gate2-no" data-i18n="aichat.btn_reject">Rifiuta</button>
  </div>
  <!-- Attesa del voto (nuovo arrivato, dopo aver accettato il gate 1) -->
  <div id="pending-banner" class="gate-banner">
    <span id="pending-text"></span>
  </div>
  <!-- Rifiutato: pulsante di re-request con cooldown (vedi admission.mjs) -->
  <div id="rejected-banner" class="gate-banner">
    <span data-i18n="aichat.rejected_text">Ingresso rifiutato.</span>
    <button id="rerequest-btn" data-i18n="aichat.btn_request_admission">Chiedi di entrare</button>
  </div>
  <!-- Banner di consenso Share with (Slice 1a-ui): "X vuole condividere Y — accetti?"
       Elemento SEPARATO da #consent (gate di ammissione) — un'offerta di
       condivisione e una richiesta di ammissione possono essere pendenti
       insieme; condividere lo stesso nodo DOM le farebbe sovrascrivere a
       vicenda (vedi spec §9). Stessa classe .gate-banner, stessa grammatica
       visiva, nessun CSS nuovo necessario. -->
  <div id="share-consent" class="gate-banner">
    <span id="share-consent-text"></span>
    <button id="share-consent-yes" data-i18n="common.yes">Sì</button>
    <button id="share-consent-no" data-i18n="common.no">No</button>
  </div>
  <div id="transcript"></div>
  <div id="input-row">
    <input id="msg" type="text" data-i18n-placeholder="aichat.input_placeholder" placeholder="Scrivi… (Invio per inviare)" autocomplete="off" />
  </div>
  <script type="module" src="aichat-window.js"></script>
</body>
</html>
