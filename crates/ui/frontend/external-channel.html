<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lare — Canale esterno</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: rgba(15, 15, 22, var(--window-alpha, 0.87));
      --text: rgba(220, 235, 255, 0.92);
      --border: rgba(80, 160, 240, 0.50);
    }
    html { background: transparent; width: 100%; height: 100%; }
    body {
      width: 100%; height: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      display: flex; flex-direction: column;
      -webkit-app-region: no-drag;
    }
    #titlebar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 12px 6px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; letter-spacing: 0.08em;
      color: rgba(130, 190, 255, 0.65);
      flex-shrink: 0; user-select: none;
    }
    #titlebar-label { pointer-events: none; text-transform: uppercase; letter-spacing: 0.12em; }
    #close-btn {
      background: transparent; border: none; color: rgba(130, 190, 255, 0.50);
      font-size: 15px; line-height: 1; cursor: pointer; padding: 0 4px;
      -webkit-app-region: no-drag;
    }
    #close-btn:hover { color: rgba(220, 100, 80, 0.90); }
    #output-area {
      flex: 1; overflow-y: auto; padding: 10px 14px;
      scrollbar-width: thin;
      scrollbar-color: rgba(80, 140, 220, 0.4) transparent;
    }
    #output-area::-webkit-scrollbar { width: 5px; }
    #output-area::-webkit-scrollbar-thumb {
      background: rgba(80, 140, 220, 0.4);
      border-radius: 3px;
    }
    #output-area pre { white-space: pre-wrap; word-break: break-word; }
    #input-bar { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
    #input-box { flex: 1; background: transparent; border: 1px solid var(--border); border-radius: 6px; color: var(--text); font: inherit; padding: 6px 8px; }
    #status-bar { display: flex; gap: 10px; font-size: 10px; padding: 2px 14px; flex-shrink: 0; }
    #status { color: rgba(130, 190, 255, 0.5); }
    /* Vuoto quando non c'è nulla in volo — occupa spazio solo mentre gira,
       niente CSS di visibilità da gestire a parte (stessa idea semplificata
       dello stile "status" dell'activity indicator del cursore v1, overlay
       F2 — rimosso in 2.0, host.js non ne ha uno — ma senza i 3 stili
       configurabili: qui basta un solo stile fisso, questa finestra non ha
       una schermata /config a parte). */
    #activity-indicator { color: rgba(130, 190, 255, 0.85); }

      /* Echo di un comando appena inviato (stesso significato di index.html). */
      .cmd-echo { margin-bottom: 4px; }
      .cmd-echo pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: rgba(100, 180, 255, 0.85);
        font-family: inherit;
        font-size: inherit;
        line-height: 1.5;
      }
      /* Banner di conferma per un tool "sensibile" (gate locale per-tool) —
         qui il caso critico è nmap_os_detect: la dialog UAC di Windows non
         mostra il target, quindi questo banner è l'UNICO punto dove l'utente
         lo vede prima di uno scan con privilegi Administrator. Stessi valori
         di index.html per coerenza visiva fra le due finestre. */
      .confirm-banner {
        margin-bottom: 6px;
        border-left: 2px solid rgba(230, 170, 60, 0.75);
        padding-left: 8px;
      }
      .confirm-banner pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: rgba(255, 210, 140, 0.95);
        font: inherit;
        font-size: inherit;
        line-height: 1.5;
      }
      .confirm-buttons { display: flex; gap: 6px; margin-top: 4px; }
      .confirm-buttons button {
        font-family: inherit;
        font-size: inherit;
        background: rgba(80, 140, 220, 0.18);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 2px 10px;
        cursor: pointer;
      }
      .confirm-buttons button:hover:not(:disabled) { background: rgba(80, 140, 220, 0.3); }
      .confirm-buttons button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region>
    <span id="titlebar-label">Canale esterno</span>
    <button id="close-btn" title="Chiudi" aria-label="Chiudi">&#x00D7;</button>
  </div>
  <div id="output-area"></div>
  <div id="status-bar">
    <span id="activity-indicator"></span>
    <span id="status"></span>
  </div>
  <div id="input-bar">
    <input id="input-box" type="text" placeholder="Scrivi..." autocomplete="off" />
  </div>
  <script type="module" src="external-channel-window.js"></script>
</body>
</html>
