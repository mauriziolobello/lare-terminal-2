<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lare Terminal</title>
  <style>
    /* ── CSS custom properties (cursor appearance — config-driven) ──────── */
    :root {
      --cursor-color: #FFFFFF;
      --cursor-font:  'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      --cursor-size:  11px;
      --bg:           rgba(15, 15, 22, var(--window-alpha, 0.87));
    }

    /* ── Reset ──────────────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* La finestra Tauri è transparent + decorations:false → il suo bordo nativo
         è invisibile. Diamo al <body> (che riempie l'INTERA finestra) un bordo
         grigio sottile: segna il bordo-finestra afferrabile per il RESIZE, a pochi
         px dal pannello. Il pannello riempie tutto il resto → niente bande
         trasparenti che intercettano i click (il pannello copre la finestra). */
      background: transparent;
      border: 1px solid rgba(80, 160, 240, 0.55); /* bordo-finestra: STESSO colore del bordo pannello — handle del resize */
      border-radius: 11px;                         /* angoli smussati come il pannello (≈ 10 del pannello + 1 di gap) */
      padding: 1px;                               /* gap di 1px → i due bordi blu diventano un "bordo doppio" coeso */
      display: flex;                               /* il pannello (unico figlio in flow) riempie la finestra */
      height: 100vh;
      /* Font driven by CSS vars — updated by app.js after get_config */
      font-family: var(--cursor-font);
      font-size: var(--cursor-size);
      color: var(--cursor-color);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    /* ── Main overlay panel ──────────────────────────────────────────────
       Wide panel (~1060px), single border, no outer glow/box-shadow. */
    .overlay-panel {
      position: relative; /* so the dialog overlay can be absolute inside */
      background: var(--bg);
      border: 1.5px solid rgba(80, 160, 240, 0.55);
      border-radius: 10px;
      padding: 18px 28px 16px 28px;
      flex: 1;       /* riempie la finestra (body è display:flex) → segue il resize */
      min-width: 0;  /* permette restringimento e scroll interno in un contenitore flex */
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Header row ───────────────────────────────────────────────────── */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .label {
      color: rgba(130, 190, 255, 0.65);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .status { font-size: 10px; letter-spacing: 0.06em; }
    .status-connecting   { color: rgba(200, 180, 80, 0.8); }
    .status-connected    { color: rgba(80, 220, 120, 0.8); }
    .status-disconnected { color: rgba(180, 80, 80, 0.8); }
    .status-error        { color: rgba(220, 80, 80, 0.9); }

    .aichat-notify {
      font-size: 12px;
      color: rgba(220, 190, 80, 0.9);
      cursor: default;
    }

    /* ── Activity indicator ──────────────────────────────────────────────── */
    .header-right { display: flex; align-items: center; gap: 6px; }
    .activity-spinner { color: rgba(130, 190, 255, 0.85); font-size: 11px; }
    #activity-title { margin-left: 8px; }
    .activity-status { letter-spacing: 0.06em; }
    .prompt.busy { animation: prompt-pulse 1s ease-in-out infinite; }
    @keyframes prompt-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

    /* ── Stop button (visibile solo durante elaborazione AI) ───────────── */
    .stop-btn {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.06em;
      background: none;
      border: 1px solid rgba(220, 80, 80, 0.6);
      color: rgba(220, 80, 80, 0.85);
      border-radius: 3px;
      padding: 1px 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .stop-btn:hover {
      background: rgba(220, 80, 80, 0.2);
      color: rgba(255, 100, 100, 1);
    }

    /* ── Clickable command hints (riga hint sotto il prompt) ───────────── */
    .hint-cmd {
      cursor: pointer;
      color: rgba(130, 190, 255, 0.7);
    }
    .hint-cmd:hover {
      color: rgba(150, 200, 255, 1);
      text-decoration: underline;
    }

    /* ── Output area ─────────────────────────────────────────────────── */
    .output-area {
      flex: 1;        /* riempie verticalmente il pannello; scrolla se l'output eccede */
      min-height: 0;  /* indispensabile perché overflow-y funzioni in un flex item */
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(80, 140, 220, 0.4) transparent;
    }
    .output-area::-webkit-scrollbar { width: 5px; }
    .output-area::-webkit-scrollbar-thumb {
      background: rgba(80, 140, 220, 0.4);
      border-radius: 3px;
    }

    /* Echo of a just-submitted command (shown immediately on Enter). */
    .cmd-echo {
      margin-bottom: 4px;
    }
    .cmd-echo pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: rgba(100, 180, 255, 0.85);
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
    }

    /* Messaggio di sistema (es. esito Share) — stessa famiglia visiva di
       .cmd-echo ma senza il glifo "›" (non è un comando digitato) e con un
       tono più smorzato (non è testo che l'utente ha appena scritto). */
    .sys-msg pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: rgba(160, 190, 220, 0.7);
      font-style: italic;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
      margin: 2px 0;
    }

    .cmd-block {
      margin-bottom: 6px;
      border-left: 2px solid rgba(80, 140, 220, 0.3);
      padding-left: 8px;
    }
    .cmd-block pre {
      white-space: pre-wrap;
      word-break: break-all;
      color: rgba(220, 235, 255, 0.9);
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
    }
    .cmd-block.done  { border-left-color: rgba(80, 200, 100, 0.5); }
    .cmd-block.error { border-left-color: rgba(220, 80, 80, 0.7); }
    .cmd-block.error pre { color: rgba(255, 160, 160, 0.95); }

    .exit-ok  { color: rgba(80, 220, 100, 0.7);  font-size: 10px; margin-top: 2px; display: block; }
    .exit-err { color: rgba(255, 120, 80, 0.8);  font-size: 10px; margin-top: 2px; display: block; }

    /* Banner di conferma per un tool AI "sensibile" (gate locale per-tool,
       Docs/superpowers/specs/2026-07-15-local-tool-confirm-gate-design.md).
       Bordo ambra per farlo risaltare rispetto ai blocchi comando normali. */
    .confirm-banner {
      margin-bottom: 6px;
      border-left: 2px solid rgba(230, 170, 60, 0.75);
      padding-left: 8px;
    }
    .confirm-banner pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: rgba(255, 210, 140, 0.95);
      font-family: inherit;
      font-size: inherit;
      line-height: 1.5;
    }
    .confirm-buttons {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .confirm-buttons button {
      font-family: inherit;
      font-size: inherit;
      background: rgba(80, 140, 220, 0.18);
      color: inherit;
      border: 1px solid rgba(80, 140, 220, 0.4);
      border-radius: 4px;
      padding: 2px 10px;
      cursor: pointer;
    }
    .confirm-buttons button:hover:not(:disabled) {
      background: rgba(80, 140, 220, 0.3);
    }
    .confirm-buttons button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* ── Markdown render-on-done (AI responses, exit_code = null) ────── */
    .cmd-block .md-output {
      font-size: 12px;
      line-height: 1.6;
      color: inherit;
      padding: 2px 0;
    }
    .cmd-block .md-output h1,
    .cmd-block .md-output h2,
    .cmd-block .md-output h3,
    .cmd-block .md-output h4 {
      margin: 0.6em 0 0.2em;
      font-weight: 600;
      color: rgba(180, 210, 240, 0.95);
      line-height: 1.3;
    }
    .cmd-block .md-output h1 { font-size: 1.25em; border-bottom: 1px solid rgba(80,140,220,0.25); padding-bottom: 0.15em; }
    .cmd-block .md-output h2 { font-size: 1.1em; }
    .cmd-block .md-output h3 { font-size: 1em; }
    .cmd-block .md-output p  { margin: 0.3em 0; }
    .cmd-block .md-output strong { color: rgba(210, 230, 250, 0.95); font-weight: 600; }
    .cmd-block .md-output em     { color: rgba(180, 210, 240, 0.8); font-style: italic; }
    .cmd-block .md-output code {
      font-family: inherit;
      background: rgba(80, 140, 220, 0.12);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 0.92em;
      color: rgba(140, 190, 255, 0.95);
    }
    .cmd-block .md-output pre {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      padding: 8px 10px;
      overflow-x: auto;
      margin: 0.4em 0;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .cmd-block .md-output pre code {
      background: none;
      padding: 0;
      color: rgba(160, 200, 240, 0.9);
    }
    .cmd-block .md-output ul,
    .cmd-block .md-output ol { margin: 0.2em 0; padding-left: 1.5em; }
    .cmd-block .md-output li  { margin: 0.1em 0; }
    .cmd-block .md-output blockquote {
      border-left: 2px solid rgba(80, 140, 220, 0.4);
      padding-left: 0.7em;
      margin: 0.3em 0;
      color: rgba(180, 210, 240, 0.65);
    }
    .cmd-block .md-output a { color: rgba(100, 170, 255, 0.9); text-decoration: none; }
    .cmd-block .md-output a:hover { text-decoration: underline; }
    .cmd-block .md-output hr {
      border: none;
      border-top: 1px solid rgba(80, 140, 220, 0.2);
      margin: 0.5em 0;
    }
    .cmd-block .md-output table { border-collapse: collapse; font-size: 0.9em; margin: 0.4em 0; }
    .cmd-block .md-output th,
    .cmd-block .md-output td   { border: 1px solid rgba(80, 140, 220, 0.2); padding: 3px 8px; }
    .cmd-block .md-output th   { background: rgba(80, 140, 220, 0.1); }

    /* ── Input row ───────────────────────────────────────────────────── */
    .input-row {
      position: relative;   /* contesto di posizionamento per #idle-duck */
      display: flex;
      align-items: flex-start;
      min-height: 22px;
    }

    .prompt {
      color: rgba(100, 180, 255, 0.75);
      margin-right: 6px;
      flex-shrink: 0;
    }

    #typed-text {
      color: var(--cursor-color);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      flex: 1 1 auto;
      min-width: 0;
    }

    /* .cursor is now rendered INSIDE #typed-text by app.js/renderEditor().
       The block covers the character at the caret (or an empty min-width block
       at end-of-line).
       ──
       Blink strategy: animate the INVERSE state (bg/colour swap), not opacity.
       This keeps the glyph always visible — the highlight alternates between
       "on" (bg = cursor colour, fg = panel bg) and "off" (bg = transparent,
       fg = cursor colour).  This matches the standard terminal block-cursor
       behaviour and avoids the character disappearing during the off phase.
       ──
       CSS keyframes override inline styles, so renderEditor() must NOT set
       background/color inline on the cursor span (the animation owns them).
       The static .cursor sibling span in the HTML is hidden (display:none). */
    .cursor {
      display: inline-block;
      white-space: pre;
      vertical-align: middle;
      animation: blink-block 1s step-start infinite;
    }

    @keyframes blink-block {
      0%,  60% {
        background: var(--cursor-color);
        color: rgba(15, 15, 22, 1);   /* panel background — inverse video ON */
      }
      61%, 100% {
        background: transparent;
        color: var(--cursor-color);   /* normal text colour — inverse video OFF */
      }
    }

    /* Hide the legacy static cursor span (now replaced by the dynamic one) */
    .cursor-static {
      display: none;
    }

    /* ── cwd line (shown above the input row) ─────────────────────────── */
    .cwd-line {
      font-size: 11px;
      color: rgba(110, 150, 190, 0.45);
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Hints row ───────────────────────────────────────────────────── */
    .hint {
      color: rgba(155, 190, 230, 0.82);
      font-size: 10px;
      letter-spacing: 0.07em;
    }

    /* Utility: hide elements without occupying layout space */
    .hidden { display: none; }

    /* ── Idle duck animation ─────────────────────────────────────────── */
    #idle-duck {
      position: absolute;
      top: 2px;             /* centra verticalmente l'emoji 18px nella riga 22px */
      left: 0;
      font-size: 18px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
      display: none;        /* nascosto di default; .walking lo mostra */
      will-change: left;    /* hint al browser per l'accelerazione HW */
      transition: transform 0.1s ease; /* flip morbido al rimbalzo */
    }
    #idle-duck.walking {
      display: block;
    }
    /* 🐤 guarda a sinistra per default (Segoe UI Emoji): flippa verso destra */
    #idle-duck.going-right {
      transform: scaleX(-1);
    }

    /* ── Hidden input ────────────────────────────────────────────────── */
    #hidden-input {
      position: absolute;
      left: -9999px;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <!-- Hidden input captures all keystrokes while keeping the overlay clean -->
  <input
    id="hidden-input"
    autocomplete="off"
    spellcheck="false"
    tabindex="0"
  />

  <!--
    data-tauri-drag-region: abilita il trascinamento della finestra quando
    l'utente fa mousedown sul PANNELLO stesso (il background, i gap, la zona
    attorno agli elementi interattivi). Tauri v2 applica il drag solo
    all'elemento CON l'attributo — i figli (input, button, .hint-cmd, ecc.)
    rimangono interattivi normalmente e NON trascinano.

    RISCHIO ALTO (da verificare live): il drag-region intercetta mousedown
    sullo sfondo del pannello. Verificare che un click FERMO (senza
    trascinamento) propaghi comunque e rifocalizzi l'#hidden-input —
    altrimenti la digitazione si rompe dopo la prima interazione col drag.
  -->
  <div class="overlay-panel" data-tauri-drag-region>
    <!-- Header: app label + connection status -->
    <div class="header-row">
      <span class="label">Lare Terminal<span id="activity-title" class="activity-spinner" aria-hidden="true"></span></span>
      <span class="header-right">
        <span id="activity-status" class="activity-spinner activity-status" aria-hidden="true"></span>
        <button id="stop-btn" class="stop-btn hidden" aria-label="Interrompi elaborazione">■ stop</button>
        <span id="aichat-notify" class="aichat-notify hidden" aria-hidden="true" title="Attività AI Chat non vista">✉</span>
        <span id="status-badge" class="status status-connecting">● connecting…</span>
      </span>
    </div>

    <!-- Scrollable command output (hidden when empty) -->
    <div id="output-area" class="output-area"></div>

    <!-- cwd line: shows the current working directory, updated on ServerMsg::Cwd -->
    <div id="cwd-line" class="cwd-line hidden"></div>

    <!-- Input row: prompt + text + cursor -->
    <div class="input-row">
      <span class="prompt">›</span>
      <!-- #typed-text now contains the cursor block rendered by app.js/renderEditor().
           The static .cursor span below is kept for HTML validity but hidden via CSS. -->
      <span id="typed-text"></span>
      <span class="cursor cursor-static"></span>
      <!-- Idle duck: posizionato assoluto dentro input-row, cammina avanti e indietro -->
      <div id="idle-duck" aria-hidden="true">🦆</div>
    </div>

    <!-- Keyboard hints -->
    <div class="hint">
      Enter to run &nbsp;·&nbsp; Esc to hide (text kept) &nbsp;·&nbsp;
      Ctrl+L to clear &nbsp;·&nbsp; Ctrl+T to reset &nbsp;·&nbsp; <span class="hint-cmd" data-cmd="/config">/config</span> &nbsp;·&nbsp; <span class="hint-cmd" data-cmd="/library">/library</span> &nbsp;·&nbsp; <span class="hint-cmd" data-cmd="/aichat">/aichat</span> &nbsp;·&nbsp; <span class="hint-cmd" data-cmd="/help">/help</span> per i comandi
    </div>

  </div>

  <!--
    ES modules: ws-client.js, renderer.js are plain ES-module files.
    Tauri's WebView2 supports ES modules natively. app.js is the wiring layer.
    (/config ora vive in una finestra a sé: config.html + config-window.js.)
  -->
  <!-- Markdown pipeline: marked → DOMPurify → innerHTML (same as window.html) -->
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
