<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lare — Plugin</title>

  <!-- DOMPurify: vendored, must load before plugin-window.js renders any HTML. -->
  <script src="vendor/purify.min.js"></script>

  <!-- Catalog CSS: design tokens and utility classes available to plugin HTML. -->
  <link rel="stylesheet" href="plugin-catalog.css" />

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Root palette — matches window-search.html / window.html ────────── */
    :root {
      --bg:         rgba(15, 15, 22, var(--window-alpha, 0.87));
      --text:       rgba(220, 235, 255, 0.92);
      --text-muted: rgba(160, 185, 220, 0.70);
      --border:     rgba(80, 160, 240, 0.50);
      --accent:     rgba(80, 160, 240, 0.85);
    }

    html { background: transparent; width: 100%; height: 100%; }

    body {
      width: 100%; height: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      /* Standard font unico app-wide (0.45.2): Cascadia Mono, monospace piu'
         sottile di Consolas, fallback a Consolas se non installato. */
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      /* Disable system drag so only #titlebar is draggable. */
      -webkit-app-region: no-drag;
    }

    /* ── Title bar ──────────────────────────────────────────────────────── */
    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px 6px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: rgba(130, 190, 255, 0.65);
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    #titlebar-label {
      pointer-events: none;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    #close-btn {
      background: transparent;
      border: none;
      color: rgba(130, 190, 255, 0.50);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
      /* Prevent the title-bar drag region from stealing this button's clicks. */
      -webkit-app-region: no-drag;
    }
    #close-btn:hover { color: rgba(220, 100, 80, 0.90); }

    /* ── Plugin content area ────────────────────────────────────────────── */
    /*
     * #plugin-root receives the sanitized HTML from the plugin via
     * sanitizeAndRender().  It is also the event delegation root:
     * clicks anywhere inside it are handled by the delegated listener in
     * plugin-window.js.
     *
     * data-tauri-drag-region is intentionally ABSENT from this element:
     * the plugin content area should not be draggable.
     */
    #plugin-root {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(80, 140, 220, 0.35) transparent;
    }
    #plugin-root::-webkit-scrollbar { width: 5px; }
    #plugin-root::-webkit-scrollbar-thumb {
      background: rgba(80, 140, 220, 0.35);
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <!-- Title bar — the data-tauri-drag-region attribute makes this the drag
       handle for the chromeless (decorations=false) window. -->
  <div id="titlebar" data-tauri-drag-region>
    <span id="titlebar-label">Lare — Plugin</span>
    <button id="close-btn" title="Chiudi" aria-label="Chiudi">&#x00D7;</button>
  </div>

  <!-- All plugin-supplied UI is injected here. -->
  <div id="plugin-root"></div>

  <!--
    type="module" defers execution until the DOM is ready AND gives us
    ES module scope (import/export).  purify.min.js loaded above is
    synchronous and sets window.DOMPurify before this module runs.
  -->
  <script type="module" src="plugin-window.js"></script>
</body>
</html>
