<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lare — Salva routine</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          rgba(15, 15, 22, var(--window-alpha, 0.87));
      --text:        rgba(220, 235, 255, 0.92);
      --text-muted:  rgba(160, 185, 220, 0.7);
      --border:      rgba(80, 160, 240, 0.55);
      --accent:      rgba(80, 160, 240, 0.8);
      --code-bg:     rgba(10, 12, 22, 0.9);
      --code-border: rgba(60, 120, 200, 0.35);
    }

    html { background: transparent; width: 100%; height: 100%; }

    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      -webkit-app-region: no-drag;
    }

    #titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 6px 16px;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(130, 190, 255, 0.6);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    #titlebar-label { pointer-events: none; }
    #close-btn {
      background: transparent;
      border: none;
      color: rgba(130, 190, 255, 0.5);
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      padding: 0 4px;
      -webkit-app-region: no-drag;
    }
    #close-btn:hover { color: rgba(220, 100, 80, 0.9); }

    #content { flex: 1; overflow-y: auto; padding: 14px 20px 20px 20px; }

    #meta { margin-bottom: 12px; }
    #meta div { margin-bottom: 4px; }
    #meta .label { color: var(--text-muted); display: inline-block; min-width: 90px; }
    #replace-banner {
      display: none;
      margin-bottom: 12px;
      padding: 6px 10px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      color: rgba(160, 210, 255, 0.95);
      font-size: 12px;
    }

    #script {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-left: 3px solid var(--accent);
      border-radius: 4px;
      padding: 12px 14px;
      overflow-x: auto;
      white-space: pre;
      font-size: 0.92em;
      color: rgba(200, 235, 180, 0.9);
    }

    #actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding: 10px 20px 16px 20px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    button.action {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
    }
    #save-action:hover { border-color: rgba(130, 220, 130, 0.9); color: rgba(160, 235, 160, 0.95); }
    #cancel-action:hover { border-color: rgba(220, 100, 80, 0.9); color: rgba(235, 150, 130, 0.95); }
  </style>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region>
    <span id="titlebar-label">Salva routine</span>
    <span><button id="close-btn" title="Annulla" aria-label="Annulla e chiudi">&#x00D7;</button></span>
  </div>
  <div id="content">
    <div id="replace-banner"></div>
    <div id="meta">
      <div><span class="label">Nome:</span><span id="meta-name"></span></div>
      <div><span class="label">Descrizione:</span><span id="meta-description"></span></div>
      <div><span class="label">Categoria:</span><span id="meta-category"></span></div>
      <div><span class="label">Tag:</span><span id="meta-tags"></span></div>
    </div>
    <pre id="script"></pre>
  </div>
  <div id="actions">
    <button id="cancel-action" class="action">Annulla</button>
    <button id="save-action" class="action">Salva</button>
  </div>

  <script type="module" src="routine-preview.js"></script>
</body>
</html>
