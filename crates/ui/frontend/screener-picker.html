<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="screener_picker.window_title">Lare — Seleziona screener</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: rgba(15, 15, 22, var(--window-alpha, 0.87));
      --text: rgba(220, 235, 255, 0.92);
      --border: rgba(80, 160, 240, 0.50);
      --sel-bg: rgba(80, 140, 220, 0.22);
    }
    html { background: transparent; width: 100%; height: 100%; }
    body {
      width: 100%; height: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      color: var(--text);
      font-family: 'Cascadia Mono Light', 'Cascadia Mono', 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      display: flex; flex-direction: column;
    }
    #titlebar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 8px 12px 6px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; letter-spacing: 0.08em;
      color: rgba(130, 190, 255, 0.65);
      flex-shrink: 0; user-select: none;
    }
    #titlebar-label { pointer-events: none; text-transform: uppercase; letter-spacing: 0.12em; }
    #close-btn {
      background: transparent; border: none; color: rgba(130, 190, 255, 0.50);
      font-size: 15px; line-height: 1; cursor: pointer; padding: 0 4px;
    }
    #close-btn:hover { color: rgba(220, 100, 80, 0.90); }
    #list-area { flex: 1; overflow-y: auto; padding: 6px; }
    .screener-item {
      padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 2px;
    }
    .screener-item.selected { background: var(--sel-bg); }
    .screener-item .item-title { font-weight: bold; }
    .screener-item .item-description { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    #empty-state { padding: 16px; opacity: 0.7; text-align: center; }
    #hint-bar { padding: 6px 12px; font-size: 10px; opacity: 0.55; border-top: 1px solid var(--border); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region>
    <span id="titlebar-label" data-i18n="screener_picker.titlebar">Seleziona screener</span>
    <button id="close-btn" data-i18n-title="common.close" data-i18n-aria-label="common.close" title="Chiudi" aria-label="Chiudi">&#x00D7;</button>
  </div>
  <div id="list-area"></div>
  <div id="hint-bar" data-i18n="screener_picker.hint_bar">&uarr;/&darr; o click per selezionare — Invio o doppio click per confermare — Esc per annullare</div>
  <script type="module" src="screener-picker.js"></script>
</body>
</html>
