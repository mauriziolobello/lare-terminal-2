[package]
# Name must be "ui" so that `cargo build -p ui` (from the repo root) works.
name = "ui"
version = "2.2.3"
edition = "2021"
publish = false

# Expose a library target so the `config` module can be unit-tested without
# starting a Tauri runtime.  The binary (main.rs) imports from this lib.
[lib]
name = "ui_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri v2 runtime
tauri = { version = "2", features = [] }

# Serialization (for Rust commands that return structured data)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Filesystem watcher — rilevamento modifiche alla cartella Library (Slice 3).
# notify-debouncer-mini (0.7.x) dipende internamente da notify 8.x;
# usiamo solo notify-debouncer-mini come dipendenza diretta e accediamo
# a notify tramite i suoi re-export (notify_debouncer_mini::notify::*).
# Questo evita conflitti di versione nel grafo delle dipendenze.
notify-debouncer-mini = "0"

# Risoluzione della cartella di configurazione (--config-dir/startup.json) —
# stesso crate usato da orchestrator e mcp-server (2.0, decisione D6: un solo
# risolutore, nessuna env var). Vedi crates/ui/src-tauri/src/config_dir.rs.
startup-config = { path = "../../startup-config" }

# PTY portabile per la finestra terminale (piano 3) — apre lare-shell.exe
# dentro una pseudo-console (ConPTY su Windows) e ne pilota I/O da Rust.
portable-pty = "0.9"

# Encoding delle sequenze OSC/keystroke scambiate col frontend xterm.js
# (piano 3, Task 5+).
base64 = "0.22"

# Generazione di identificatori casuali (es. id di sessione terminale,
# piano 3, Task 5+).
rand = "0.8"

# Logging su file (Configuration/logs/ui.log) — modulo condiviso con
# l'orchestrator, vedi startup_config::logging. Prima di questo fix ui.exe
# non aveva NESSUN log su file (solo println!/eprintln!, invisibili in
# release perché ui.exe non ha mai stdout/stderr con windows_subsystem =
# "windows").
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
# Used in config tests: create temp files/dirs with auto-cleanup.
tempfile = "3"
